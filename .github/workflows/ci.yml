name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        # v6 runs on Node 24; v4 runs on Node 20 which GitHub is
        # deprecating (removal scheduled 2026-09-16).
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Build must run before typecheck: workspace packages import each
      # other via `workspace:*` and resolve to `dist/index.d.ts` — that
      # file only exists after the build. Locally this is masked by
      # leftover dist dirs from prior runs; CI starts clean.
      - name: Build
        run: pnpm build
        env:
          NX_DAEMON: false

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
