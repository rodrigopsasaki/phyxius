name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest

    # Authenticated via npm Trusted Publishing (OIDC). Each @phyxiusjs/*
    # package on npmjs.com has a trust relationship pointing at this repo
    # + this workflow file, so the publish step mints a short-lived OIDC
    # token at runtime — no NPM_TOKEN, no long-lived secret.
    # Provenance attestations are automatic for public-repo + public-package.

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24 ships with npm CLI >= 11.5.1, required for Trusted
          # Publishing OIDC mint at publish time.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NX_DAEMON: false

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
