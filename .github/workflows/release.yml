name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest

    # Release stays gated until the bootstrap publish lands and trusted
    # publishing is configured on each @phyxiusjs/* package on npmjs.com.
    #
    # Sequence to enable:
    #   1. Bootstrap publish locally with `pnpm -r publish --access public`
    #      after `npm login --auth-type=web`. Creates all packages on npm.
    #   2. Configure Trusted Publisher on each package on npmjs.com,
    #      pointing at this repo + this workflow file. (Or use the
    #      `npm trust` CLI on npm >= 11.10.0.)
    #   3. Delete the `if: false` line below. The job switches to OIDC —
    #      no NPM_TOKEN needed; provenance attestations are automatic.
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24 ships with npm CLI >= 11.5.1, required for Trusted
          # Publishing OIDC mint at publish time.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NX_DAEMON: false

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
